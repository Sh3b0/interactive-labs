services:
  labenv:
    image: sh3b0/labenv:dev
    container_name: labenv
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8080:8080"
    environment:
      - SHELL=/usr/bin/fish
    volumes:
      - ./workspace:/home/ubuntu
      # - ./workshop:/app/workshop
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lab_net
    restart: unless-stopped

  firefox:
    image: jlesage/firefox:v26.08.2
    container_name: firefox
    ports:
      - "127.0.0.1:5800:5800"
    volumes:
      - ./workspace/downloads:/config/downloads
    networks:
      - lab_net
    restart: unless-stopped

  studio:
    image: sh3b0/studio:stable
    container_name: studio
    ports:
        - "9000:9000"
    volumes:
      - ./workspace/recordings:/recordings
    networks:
      - lab_net
    restart: unless-stopped

networks:
  lab_net:
    name: lab_net
