# https://github.com/lima-vm/lima/blob/master/templates/default.yaml

vmType: "qemu" # "vz" for MacOS Ventura and later

images:
  - location: "https://github.com/Sh3b0/interactive-labs/releases/download/boxes/labenv-amd64.qcow2"
    arch: x86_64

# images:
#   - location: "https://github.com/Sh3b0/interactive-labs/releases/download/boxes/labenv-arm64.qcow2"
#     arch: aarch64

cpus: 4
memory: "4GiB"
disk: "20GiB"

containerd:
  system: false
  user: false

mounts:
  - location: "{{.Home}}/workshop"
    mountPoint: /app/workshop
    writable: true

provision:
- mode: system
  script: |
    #!/bin/bash

    docker run -p5800:5800 -d --network lab_net jlesage/firefox:v26.01.1

    echo "==> Provisioning complete! Access labenv at http://localhost:3000 (if using port-forwarding)"
    echo "==> Additional machine IPs: $(hostname -I)"

user:
  name: ubuntu
  uid: 1000
  home: /home/ubuntu
  shell: /usr/bin/fish

hostResolver:
  hosts:
    host.docker.internal: host.lima.internal

# For vz vmType
# networks:
#   - vzNAT: true

portForwards:
  - guestPortRange: [1, 65535]
