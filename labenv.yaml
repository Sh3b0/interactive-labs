# https://github.com/lima-vm/lima/blob/master/templates/default.yaml

vmType: "qemu" # "vz" for MacOS Ventura (13) and later

images:
  - location: "https://github.com/Sh3b0/interactive-labs/releases/download/boxes/labenv-amd64.qcow2"
    arch: x86_64

# images:
#   - location: "https://github.com/Sh3b0/interactive-labs/releases/download/boxes/labenv-arm64.qcow2"
#     arch: aarch64

cpus: 4
memory: "4GiB"
disk: "20GiB"

containerd:
  system: false
  user: false

# mounts:
#   - location: "{{.Home}}/shared"
#     writable: true
#     mountPoint: "/home/ubuntu/shared"

provision:
- mode: system
  script: |
    #!/bin/bash

    # Fixes for some 'Name or service not known' errors
    echo "127.0.0.1  localhost.localdomain" >> /etc/hosts
    echo "127.0.0.1  lima-labenv" >> /etc/hosts
    
    # Preparing browser container
    docker network create lab_net || true
    docker pull -q jlesage/firefox:v26.01.1
    docker run -p5800:5800 -d --network lab_net -v /home/ubuntu/downloads:/config/downloads jlesage/firefox:v26.08.2

    # Preparing studio container
    docker pull -q sh3b0/studio:stable
    docker run -p9000:9000 -d --network lab_net -v /home/ubuntu/recordings:/recordings sh3b0/studio:stable

    echo "==> Provisioning complete! Access labenv at http://localhost:3000 (if using port-forwarding)"
    echo "==> Additional machine IPs: $(hostname -I)"

user:
  name: ubuntu
  uid: 1000
  home: /home/ubuntu
  shell: /usr/bin/fish

hostResolver:
  hosts:
    host.docker.internal: host.lima.internal

# For vz vmType
# networks:
#   - vzNAT: true

portForwards:
  - guestPortRange: [1, 65535]
